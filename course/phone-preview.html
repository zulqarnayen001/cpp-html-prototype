<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone preview</title>
<!-- Review page, not part of the course: shows one slide of index.html at several phone sizes side by side, plus a
     frame you can drag to any width. Desktop browsers stop a window at about 500 px, so this is the way to see the
     narrow phones on a computer. Each phone is the real course (it runs, and you can tap through it), muted. -->
<style>
  :root { --ink: #23343a; --muted: #5d6d72; --line: #d6e0e3; --brand: #285f74; --bg: #eef3f4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 14px 20px; background: #fff; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 18px; }
  label { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
  select, button { font: inherit; padding: 6px 10px; border: 1px solid #b9c7cb; border-radius: 6px; background: #fff; color: var(--ink); }
  button { cursor: pointer; }
  button:hover { background: #f1f6f7; }
  .hint { flex-basis: 100%; margin: 0; color: var(--muted); font-size: 13px; }
  main { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 28px; padding: 24px 20px 40px; }
  figure { margin: 0; }
  figcaption { margin-bottom: 8px; font-size: 13px; color: var(--muted); }
  figcaption b { color: var(--ink); }
  /* The outline is a shadow, not a border, so the course inside gets the phone's exact width */
  .phone { border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 0 0 1px #b9c7cb, 0 6px 20px rgba(20, 50, 60, .12); }
  .phone iframe { display: block; border: 0; width: 100%; height: 100%; }
  .scale-wrap { transform-origin: 0 0; }
  /* The drag frame: pull its bottom-right corner to try any width */
  .drag { resize: both; overflow: hidden; min-width: 240px; min-height: 420px; max-width: 900px; }
  .drag-size { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>The CPP and Me: phone preview</h1>
  <label>Slide
    <select id="slide">
      <option value="">Start screen</option>
      <option value="s1_1">1.1 The CPP and Me</option>
      <option value="s1_2">1.2 Navigating the Course</option>
      <option value="s2_1">2.1 The CPP: Helping support your future</option>
      <option value="s2_2">2.2 Video</option>
      <option value="s2_3">2.3 CPP Fact Check Challenge</option>
      <option value="q1">Question 1</option>
      <option value="q2">Question 2</option>
      <option value="s3_2">Challenge Complete</option>
      <option value="s3_3">Results</option>
      <option value="s4_1">4.1 Extension Activity</option>
      <option value="s4_2">4.2 CPP Key Terms</option>
      <option value="s4_4">Thank You</option>
    </select>
  </label>
  <label><input type="checkbox" id="end" checked> Show the slide's last moment</label>
  <label>Size
    <select id="scale">
      <option value="1">100%</option>
      <option value="0.75" selected>75%</option>
      <option value="0.5">50%</option>
    </select>
  </label>
  <button id="reload" type="button">Reload</button>
  <p class="hint">Each phone runs the real course, muted, so you can tap through it. The last frame can be dragged to any
    width from its bottom-right corner. To check a real phone, open <code>index.html</code> on it.</p>
</header>
<main id="phones"></main>
<script>
  const DEVICES = [
    ['Galaxy Z Fold, folded', 280, 653],
    ['iPhone SE (1st gen)', 320, 568],
    ['Android, small', 360, 780],
    ['iPhone SE', 375, 667],
    ['iPhone 14', 390, 844],
    ['Pixel 8', 412, 915],
    ['iPhone 15 Pro Max', 430, 932],
  ];
  const $ = s => document.querySelector(s);
  const main = $('#phones');
  let n = 0;
  function src() {
    const id = $('#slide').value, end = $('#end').checked;
    const hash = id ? `#slide=${id}${end ? '&end=1' : ''}&mute=1` : '';
    return `index.html?preview=${++n}${hash}`;
  }
  function frame(name, w, h, drag) {
    const k = +$('#scale').value;
    const fig = document.createElement('figure');
    const cap = document.createElement('figcaption');
    cap.innerHTML = drag ? `<b>Drag to resize</b> <span class="drag-size">${w} x ${h}</span>` : `<b>${name}</b> ${w} x ${h}`;
    const outer = document.createElement('div');       // reserves the scaled size in the layout
    const wrap = document.createElement('div');         // the phone at its real size, scaled down
    wrap.className = 'scale-wrap';
    wrap.style.transform = `scale(${k})`;
    const phone = document.createElement('div');
    phone.className = 'phone' + (drag ? ' drag' : '');
    phone.style.width = w + 'px'; phone.style.height = h + 'px';
    const ifr = document.createElement('iframe');
    ifr.title = `${name}, ${w} by ${h}`;
    ifr.src = src();
    phone.append(ifr); wrap.append(phone); outer.append(wrap);
    // Reserve the scaled size (the phone isn't on the page yet the first time, so fall back to its set size)
    const size = () => { outer.style.width = (phone.offsetWidth || w) * k + 'px'; outer.style.height = (phone.offsetHeight || h) * k + 'px'; };
    size();
    if (drag) new ResizeObserver(() => {
      size(); cap.querySelector('.drag-size').textContent = `${phone.offsetWidth} x ${phone.offsetHeight}`;
    }).observe(phone);
    fig.append(cap, outer);
    return fig;
  }
  function build() {
    main.innerHTML = '';
    DEVICES.forEach(([name, w, h]) => main.append(frame(name, w, h)));
    main.append(frame('Custom', 340, 720, true));
  }
  $('#slide').addEventListener('change', () => { document.querySelectorAll('#phones iframe').forEach(f => f.src = src()); });
  $('#end').addEventListener('change', () => { document.querySelectorAll('#phones iframe').forEach(f => f.src = src()); });
  $('#scale').addEventListener('change', build);
  $('#reload').addEventListener('click', build);
  build();
</script>
</body>
</html>
